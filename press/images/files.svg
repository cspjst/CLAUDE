<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="398" rx="14" fill="#fdfcf8" stroke="#d8d4c8"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#222">Where the files live</text>

  <!-- your computer -->
  <rect x="30" y="66" width="230" height="130" rx="10" fill="#fbe7d3" stroke="#d9822b" stroke-width="2"/>
  <text x="48" y="94" font-size="16" font-weight="bold" fill="#8a4a0f">Your computer</text>
  <text x="48" y="118" font-size="14" fill="#4a3320" font-family="Menlo, Consolas, monospace">~/synergy</text>
  <text x="48" y="144" font-size="14" font-weight="bold" fill="#4a3320">the oracle</text>
  <text x="48" y="164" font-size="13" fill="#4a3320">the source of truth;</text>
  <text x="48" y="182" font-size="13" fill="#4a3320">git keeps the versions</text>

  <!-- workspace -->
  <rect x="300" y="66" width="220" height="130" rx="10" fill="#f1f1ef" stroke="#9a9a92"/>
  <text x="318" y="94" font-size="16" font-weight="bold" fill="#333">Claude's workspace</text>
  <text x="318" y="120" font-size="13" fill="#555">a private machine in</text>
  <text x="318" y="138" font-size="13" fill="#555">the cloud; it holds the</text>
  <text x="318" y="156" font-size="13" fill="#555">GitHub link</text>

  <!-- github -->
  <rect x="560" y="66" width="230" height="130" rx="10" fill="#eaf1f8" stroke="#8fb0d0"/>
  <text x="578" y="94" font-size="16" font-weight="bold" fill="#1f4e79">GitHub</text>
  <text x="578" y="118" font-size="14" fill="#1f3550" font-family="Menlo, Consolas, monospace">cspjst/SYNERGY</text>
  <text x="578" y="144" font-size="14" font-weight="bold" fill="#1f3550">the backup</text>
  <text x="578" y="164" font-size="13" fill="#1f3550">and what readers</text>
  <text x="578" y="182" font-size="13" fill="#1f3550">see first</text>

  <g stroke="#5b6470" stroke-width="2" fill="none">
    <line x1="262" y1="130" x2="296" y2="130" marker-end="url(#a)"/>
    <line x1="522" y1="130" x2="556" y2="130" marker-end="url(#a)"/>
    <path d="M675,198 L675,232 L145,232 L145,202" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <line x1="60" y1="198" x2="60" y2="282" marker-end="url(#a)"/>
  </g>
  <text x="70" y="262" font-size="12" fill="#5b6470">copies</text>
  <text x="300" y="224" font-size="13" fill="#5b6470">then your computer is brought level, so all three agree</text>

  <!-- project copies -->
  <rect x="30" y="286" width="230" height="74" rx="10" fill="#f1f1ef" stroke="#9a9a92"/>
  <text x="48" y="312" font-size="16" font-weight="bold" fill="#333">The Claude project</text>
  <text x="48" y="334" font-size="13" fill="#555">copies, so every chat</text>
  <text x="48" y="351" font-size="13" fill="#555">can read them</text>

  <g font-size="13" fill="#333">
    <text x="300" y="282" font-weight="bold">The steps</text>
    <text x="300" y="304">1. Every department commits on your computer.</text>
    <text x="300" y="324">2. WELFARE alone carries the commits to its workspace — your</text>
    <text x="318" y="342">computer's shell has no GitHub password — and pushes from there.</text>
    <text x="300" y="362">3. Only on the human's word. Setting up the link: connect-github.md.</text>
  </g>
</svg>
