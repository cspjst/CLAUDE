<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="518" rx="14" fill="#fdfcf8" stroke="#d8d4c8"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#222">One project, many departments</text>

  <!-- documents band -->
  <rect x="30" y="62" width="760" height="112" rx="10" fill="#eaf1f8" stroke="#8fb0d0"/>
  <text x="48" y="88" font-size="15" font-weight="bold" fill="#1f4e79">Project documents — the memory</text>
  <g font-size="13" fill="#1f3550" text-anchor="middle">
    <rect x="48"  y="104" width="132" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/><text x="114" y="126">code of</text><text x="114" y="143">conduct (signed)</text>
    <rect x="194" y="104" width="132" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/><text x="260" y="126">working</text><text x="260" y="143">agreement</text>
    <rect x="340" y="104" width="132" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/><text x="406" y="126">stakeholders</text><text x="406" y="143">list</text>
    <rect x="486" y="104" width="132" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/><text x="552" y="126">historiography</text><text x="552" y="143">(why, and who said)</text>
    <rect x="632" y="104" width="140" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/><text x="702" y="126">department notes,</text><text x="702" y="143">handovers</text>
  </g>

  <!-- read / write -->
  <line x1="180" y1="180" x2="180" y2="226" stroke="#5b6470" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="194" y="208" font-size="13" fill="#5b6470">read first · write as it happens</text>

  <!-- conversations -->
  <text x="30" y="250" font-size="15" font-weight="bold" fill="#444">Conversations — the workshop</text>
  <rect x="30" y="262" width="320" height="186" rx="10" fill="#fbe7d3" stroke="#d9822b" stroke-width="2"/>
  <text x="50" y="296" font-size="22" font-weight="bold" fill="#8a4a0f">WELFARE</text>
  <text x="50" y="318" font-size="14" fill="#8a4a0f">the main department — start here</text>
  <g font-size="14" fill="#4a3320">
    <text x="50" y="350">• who the stakeholders are</text>
    <text x="50" y="372">• the code of conduct</text>
    <text x="50" y="394">• meals, breaks and bed</text>
    <text x="50" y="416">• keeps the history</text>
  </g>

  <g font-size="14">
    <rect x="480" y="262" width="310" height="52" rx="8" fill="#f1f1ef" stroke="#9a9a92"/>
    <text x="498" y="285" font-weight="bold" fill="#333">PRESS</text><text x="498" y="303" fill="#555" font-size="13">the story, for readers outside</text>
    <rect x="480" y="329" width="310" height="52" rx="8" fill="#f1f1ef" stroke="#9a9a92"/>
    <text x="498" y="352" font-weight="bold" fill="#333">PCODE, SNO …</text><text x="498" y="370" fill="#555" font-size="13">the work itself — SMALL-C's, for example</text>
    <rect x="480" y="396" width="310" height="52" rx="8" fill="#f1f1ef" stroke="#9a9a92" stroke-dasharray="5 4"/>
    <text x="498" y="419" font-weight="bold" fill="#333">a new department</text><text x="498" y="437" fill="#555" font-size="13">one chat, one remit, renamed by hand</text>
  </g>
  <g stroke="#5b6470" stroke-width="2" fill="none">
    <line x1="478" y1="288" x2="356" y2="320" marker-end="url(#a)"/>
    <line x1="478" y1="355" x2="356" y2="355" marker-end="url(#a)"/>
    <line x1="478" y1="422" x2="356" y2="390" marker-end="url(#a)"/>
  </g>
  <text x="380" y="342" font-size="13" fill="#5b6470">handover</text>

  <text x="30" y="482" font-size="13.5" fill="#555">Each department is a chat with a remit: what it does, and what it doesn't. Chats get compacted</text>
  <text x="30" y="501" font-size="13.5" fill="#555">or deleted; the documents survive. The human decides; Claude drafts.</text>
</svg>
