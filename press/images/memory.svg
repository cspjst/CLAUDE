<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="298" rx="14" fill="#fdfcf8" stroke="#d8d4c8"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#222">The chat forgets. The folder doesn't.</text>

  <rect x="30" y="70" width="200" height="120" rx="10" fill="#f1f1ef" stroke="#9a9a92" stroke-dasharray="6 4"/>
  <text x="48" y="98" font-size="16" font-weight="bold" fill="#555">Monday's session</text>
  <text x="48" y="122" font-size="13" fill="#666">does the work, and</text>
  <text x="48" y="140" font-size="13" fill="#666">writes it down as it</text>
  <text x="48" y="158" font-size="13" fill="#666">happens. Then it's gone.</text>

  <rect x="300" y="70" width="220" height="120" rx="10" fill="#fbe7d3" stroke="#d9822b" stroke-width="2"/>
  <text x="318" y="98" font-size="16" font-weight="bold" fill="#8a4a0f">The project folder</text>
  <text x="318" y="122" font-size="13" fill="#4a3320">decisions, notes, history:</text>
  <text x="318" y="140" font-size="13" fill="#4a3320">plain files, with who and when</text>
  <text x="318" y="164" font-size="13" font-weight="bold" fill="#4a3320">git keeps every version</text>

  <rect x="590" y="70" width="200" height="120" rx="10" fill="#e5f2e3" stroke="#6aa463" stroke-width="2"/>
  <text x="608" y="98" font-size="16" font-weight="bold" fill="#2f5d2a">Tuesday's session</text>
  <text x="608" y="122" font-size="13" fill="#2b3f28">starts knowing nothing,</text>
  <text x="608" y="140" font-size="13" fill="#2b3f28">reads the folder first,</text>
  <text x="608" y="158" font-size="13" fill="#2b3f28">checks before claiming.</text>

  <g stroke="#5b6470" stroke-width="2" fill="none">
    <line x1="232" y1="130" x2="296" y2="130" marker-end="url(#a)"/>
    <line x1="522" y1="130" x2="586" y2="130" marker-end="url(#a)"/>
  </g>
  <text x="246" y="120" font-size="12" fill="#5b6470">writes</text>
  <text x="538" y="120" font-size="12" fill="#5b6470">reads</text>

  <g font-size="13.5" fill="#555">
    <text x="30" y="232">Nothing important lives only in the chat. If it isn't in the folder, the next session</text>
    <text x="30" y="252">doesn't know it, and anything it seems to remember is treated as a guess until the</text>
    <text x="30" y="272">folder confirms it.</text>
  </g>
</svg>
