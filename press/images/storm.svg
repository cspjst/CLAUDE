<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="328" rx="14" fill="#fdfcf8" stroke="#d8d4c8"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#222">Storms become norms</text>
  <text x="30" y="64" font-size="13.5" fill="#555">Something goes wrong; WELFARE writes down what happened and turns it into a rule. Example: 27 October 2026.</text>

  <g font-size="13">
    <rect x="30"  y="88" width="170" height="168" rx="10" fill="#fbe0dc" stroke="#c0504d"/>
    <text x="46" y="116" font-size="17" font-weight="bold" fill="#7a2420">Storm</text>
    <text x="46" y="142" fill="#4a2a28">18:29. Dinner was</text>
    <text x="46" y="160" fill="#4a2a28">at 18:30; Claude</text>
    <text x="46" y="178" fill="#4a2a28">said nothing — no</text>
    <text x="46" y="196" fill="#4a2a28">rule covered meals.</text>

    <rect x="230" y="88" width="170" height="168" rx="10" fill="#eaf1f8" stroke="#8fb0d0"/>
    <text x="246" y="116" font-size="17" font-weight="bold" fill="#1f4e79">Record</text>
    <text x="246" y="142" fill="#1f3550">What happened, and</text>
    <text x="246" y="160" fill="#1f3550">who said what, is</text>
    <text x="246" y="178" fill="#1f3550">written down —</text>
    <text x="246" y="196" fill="#1f3550">dated and quoted.</text>

    <rect x="430" y="88" width="170" height="168" rx="10" fill="#fbe7d3" stroke="#d9822b" stroke-width="2"/>
    <text x="446" y="116" font-size="17" font-weight="bold" fill="#8a4a0f">Norm</text>
    <text x="446" y="142" fill="#4a3320">19:58. Rule 2 of the</text>
    <text x="446" y="160" fill="#4a3320">code of conduct:</text>
    <text x="446" y="178" fill="#4a3320">meal times, breaks,</text>
    <text x="446" y="196" fill="#4a3320">bed before midnight.</text>
    <text x="446" y="214" fill="#4a3320">The human signs it.</text>

    <rect x="630" y="88" width="160" height="168" rx="10" fill="#e5f2e3" stroke="#6aa463"/>
    <text x="646" y="116" font-size="17" font-weight="bold" fill="#2f5d2a">Work</text>
    <text x="646" y="142" fill="#2b3f28">Every new chat</text>
    <text x="646" y="160" fill="#2b3f28">reads the code of</text>
    <text x="646" y="178" fill="#2b3f28">conduct first, and</text>
    <text x="646" y="196" fill="#2b3f28">mentions dinner.</text>
  </g>
  <g stroke="#5b6470" stroke-width="2" fill="none">
    <line x1="202" y1="172" x2="226" y2="172" marker-end="url(#a)"/>
    <line x1="402" y1="172" x2="426" y2="172" marker-end="url(#a)"/>
    <line x1="602" y1="172" x2="626" y2="172" marker-end="url(#a)"/>
    <path d="M710,258 L710,284 L115,284 L115,262" stroke-dasharray="6 5" marker-end="url(#a)"/>
  </g>
  <text x="250" y="306" font-size="13" fill="#5b6470">…until the next storm. Storming is expected: it's where the rules come from.</text>
</svg>
