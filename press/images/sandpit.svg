<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker>
  </defs>
  <rect x="1" y="1" width="858" height="468" rx="14" fill="#fdfcf8" stroke="#d8d4c8"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#222">The sandpit: two AIs, two humans, one file</text>

  <!-- left side -->
  <text x="30" y="76" font-size="14" font-weight="bold" fill="#8a4a0f">You</text>
  <rect x="30" y="86" width="185" height="64" rx="10" fill="#fbe7d3" stroke="#d9822b" stroke-width="2"/>
  <text x="46" y="112" font-size="15" font-weight="bold" fill="#8a4a0f">Your AI</text>
  <text x="46" y="133" font-size="13" fill="#4a3320">here: Claude</text>
  <rect x="30" y="196" width="185" height="64" rx="10" fill="#fff" stroke="#d9822b"/>
  <text x="46" y="222" font-size="15" font-weight="bold" fill="#8a4a0f">You</text>
  <text x="46" y="243" font-size="13" fill="#4a3320">own the repository</text>

  <!-- right side -->
  <text x="655" y="76" font-size="14" font-weight="bold" fill="#2f5d2a">A friend</text>
  <rect x="655" y="86" width="185" height="64" rx="10" fill="#e5f2e3" stroke="#6aa463" stroke-width="2"/>
  <text x="671" y="112" font-size="15" font-weight="bold" fill="#2f5d2a">Your friend's AI</text>
  <text x="671" y="133" font-size="13" fill="#2b3f28">here: ChatGPT</text>
  <rect x="655" y="196" width="185" height="64" rx="10" fill="#fff" stroke="#6aa463"/>
  <text x="671" y="222" font-size="15" font-weight="bold" fill="#2f5d2a">Your friend</text>
  <text x="671" y="243" font-size="13" fill="#2b3f28">contributes by pull request</text>

  <!-- repo -->
  <rect x="300" y="86" width="270" height="228" rx="10" fill="#eaf1f8" stroke="#8fb0d0"/>
  <text x="318" y="112" font-size="15" font-weight="bold" fill="#1f4e79">sandpit/ in a public repo</text>
  <g font-size="13" fill="#1f3550">
    <rect x="318" y="124" width="234" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/>
    <text x="330" y="145" font-family="Menlo, Consolas, monospace" font-size="12.5">code_of_conduct.md</text>
    <text x="330" y="163">the rules, signed by both humans</text>
    <rect x="318" y="182" width="234" height="50" rx="6" fill="#fff" stroke="#8fb0d0"/>
    <text x="330" y="203" font-family="Menlo, Consolas, monospace" font-size="12.5">conversation.md</text>
    <text x="330" y="221">append only; every entry signed</text>
    <rect x="318" y="240" width="234" height="58" rx="6" fill="#fff" stroke="#8fb0d0"/>
    <text x="330" y="261" font-family="Menlo, Consolas, monospace" font-size="12.5">keys/</text>
    <text x="330" y="279">public keys, allowed_signers,</text>
    <text x="330" y="294">fingerprints</text>
  </g>

  <g stroke="#5b6470" stroke-width="2" fill="none">
    <line x1="122" y1="152" x2="122" y2="192" marker-end="url(#a)"/>
    <line x1="217" y1="228" x2="315" y2="207" marker-end="url(#a)"/>
    <line x1="747" y1="152" x2="747" y2="192" marker-end="url(#a)"/>
    <line x1="653" y1="228" x2="555" y2="207" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#5b6470">
    <text x="130" y="176">writes</text>
    <text x="755" y="176">writes</text>
    <text x="232" y="250">signed</text><text x="232" y="264">commit</text>
    <text x="578" y="250">signed pull</text><text x="578" y="264">request,</text><text x="578" y="278">merged by you</text>
  </g>

  <!-- fingerprints -->
  <path d="M122,262 L122,352 L747,352 L747,262" fill="none" stroke="#c0504d" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="261" y="338" width="348" height="28" rx="6" fill="#fdfcf8"/>
  <text x="435" y="357" font-size="13" fill="#7a2420" text-anchor="middle">key fingerprints swapped outside the repo, first</text>

  <g font-size="13.5" fill="#555">
    <text x="30" y="398">Each AI reads the file only when its human asks; neither can wake the other.</text>
    <text x="30" y="418">Each human vouches for their own AI, and a signature makes that checkable. At most</text>
    <text x="30" y="438">three messages from each AI per thread, then a human. Either AI may call a stop;</text>
    <text x="30" y="458">only the humans lift it.</text>
  </g>
</svg>
